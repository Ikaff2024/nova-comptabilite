name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nova
      DATABASE_URL: postgres://nova_app:nova_app@localhost:5432/nova
      # test:dbguard cree des roles jetables : il lui faut une identite admin.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (front + serveur)
        run: npm run typecheck

      # Autorité UNIQUE d'application des migrations. La boucle psql qui vivait
      # ici était une quatrième voie parallèle (avec migrate-boot.mjs, la
      # migration in-process et migrate.mjs) et, surtout, ne renseignait pas la
      # table _migrations — la CI validait donc un schéma dont la version
      # n'était pas traçable. Un échec sort en code non nul et arrête le job.
      - name: Apply migrations (fail-closed)
        run: npm run migrate

      - name: SQL smoke test (ledger, immuabilité, RLS)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke_test.sql

      # Rejoue les trois attaques que la revue CTO 001 avait réussies. Chaque
      # bloc lève à la première violation : une régression sur un invariant P0
      # met la CI au rouge, elle ne passe pas inaperçue.
      - name: Invariants P0 (immuabilité, isolation des vues, frontière locataire)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/fixture_two_tenants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_invariants.sql

      - name: Garde d'identité PostgreSQL au démarrage (NOVA-P0-02)
        run: npm run test:dbguard

      # Lance réellement l'API contre des bases manipulées : migration cassée,
      # schéma en retard, invariant P0 retiré, rôle dangereux. Vérifie qu'aucune
      # de ces situations n'ouvre le port (NOVA-P1-08).
      - name: Démarrage fail-closed (NOVA-P1-08)
        run: npm run test:startup

      # Suppression d'un dossier RÉELLEMENT peuplé (NOUVEAU-P1-A), et vérification
      # que la porte de démontage reste infranchissable depuis une route normale.
      - name: Cycle de vie des dossiers
        run: npm run test:dossier-lifecycle

      # Constats de l'audit externe du 21 septembre 2026 : compte de démonstration
      # sans droits opérateur (N01) et exercice de travail de Lexa (N05).
      - name: Constats de l'audit externe
        run: npm run test:audit-externe

      # Récupération de mot de passe (N10) : non-divulgation des comptes, usage
      # unique, expiration, et invalidation des sessions ouvertes après succès.
      - name: Récupération de mot de passe
        run: npm run test:password-reset

      - name: Domain integration test
        run: npm run test:domain
