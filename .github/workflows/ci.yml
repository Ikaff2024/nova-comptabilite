name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nova
      DATABASE_URL: postgres://nova_app:nova_app@localhost:5432/nova
      # test:dbguard cree des roles jetables : il lui faut une identite admin.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (front + serveur)
        run: npm run typecheck

      # Autorité UNIQUE d'application des migrations. La boucle psql qui vivait
      # ici était une quatrième voie parallèle (avec migrate-boot.mjs, la
      # migration in-process et migrate.mjs) et, surtout, ne renseignait pas la
      # table _migrations — la CI validait donc un schéma dont la version
      # n'était pas traçable. Un échec sort en code non nul et arrête le job.
      - name: Apply migrations (fail-closed)
        run: npm run migrate

      - name: SQL smoke test (ledger, immuabilité, RLS)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke_test.sql

      # Rejoue les trois attaques que la revue CTO 001 avait réussies. Chaque
      # bloc lève à la première violation : une régression sur un invariant P0
      # met la CI au rouge, elle ne passe pas inaperçue.
      - name: Invariants P0 (immuabilité, isolation des vues, frontière locataire)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/fixture_two_tenants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_invariants.sql

      # TOUTES les suites, découvertes dans package.json (NOVA-P1-06).
      #
      # Le dépôt déclarait dix-huit suites et la CI en exécutait UNE : environ
      # 429 contrôles — paie, états financiers, notes annexes, sécurité — ne
      # tournaient jamais. Un merge vert ne garantissait presque rien.
      #
      # Le lanceur DÉCOUVRE les suites au lieu d'en tenir la liste : ajouter un
      # script `test:*` suffit à le faire tourner ici. C'est ce qui traite la
      # cause — les suites avaient été écrites une à une, sans que personne
      # pense à les brancher — plutôt que le symptôme.
      #
      # 23 suites, ~2 minutes : aucune raison de découper en paliers.
      - name: Toutes les suites de tests
        run: npm run test:all

      # Le front n'était jamais construit en CI : une erreur de compilation
      # d'interface n'apparaissait qu'au déploiement.
      - name: Build du front
        run: npm run build

      # Échoue sur une vulnérabilité « high ». Les dépendances de production
      # seulement : l'outillage de développement ne part pas en production.
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
