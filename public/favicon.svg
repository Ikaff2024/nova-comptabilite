<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nova Comptabilité">
  <!--
    Reprise exacte de la marque affichée dans la barre latérale : tuile au
    dégradé émeraude, hexagone plein en presque-noir.

    La tuile pleine n'est pas décorative. Un simple glyphe posé sur le fond de
    l'onglet disparaît selon le thème du navigateur, clair ou sombre ; la tuile
    porte son propre contraste et reste lisible dans les deux — c'est ce qui
    distingue une icône d'application d'un dessin.
  -->
  <defs>
    <linearGradient id="nova" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#nova)"/>
  <polygon points="16,7 23.79,11.5 23.79,20.5 16,25 8.21,20.5 8.21,11.5" fill="#09090b"/>
</svg>
